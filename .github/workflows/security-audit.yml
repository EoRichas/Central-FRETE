name: Auditoria NPM isolada

on:
  push:
    branches:
      - audit/npm-security-2026-09-09

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci --include=dev
      - name: Listar todas as vulnerabilidades
        run: npm audit --json || true
      - name: Listar vulnerabilidades de produção
        run: npm audit --omit=dev --json || true
