name: Validar Central Frete

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Auditar todas as dependências
        run: npm audit --audit-level=high

      - name: Executar testes de regressão
        run: npm test

      - name: Executar testes de integração
        run: npm run test:integration

      - name: Validar tipos TypeScript
        run: npm exec -- tsc --noEmit

      - name: Verificar build de produção
        run: npm run build
